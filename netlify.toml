[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "echo dist ja construido e verificado localmente"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/dados"
  to = "/.netlify/functions/sheets-data"
  status = 200

[[redirects]]
  from = "/api/ia"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/relatorios-acesso"
  to = "/.netlify/functions/reports-auth"
  status = 200

[[redirects]]
  from = "/api/fotos"
  to = "/.netlify/functions/photos"
  status = 200

[[redirects]]
  from = "/api/registros"
  to = "/.netlify/functions/records"
  status = 200

[[redirects]]
  from = "/relatorios"
  to = "/relatorios.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://docs.google.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
